<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Emeralds Task Board</title>
<meta name="description" content="Tasks, links and deadlines for Emeralds International School staff.">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style id="app-style">
/* Layout: floating glass header with the crest set free on white, over a slowly drifting
   navy/emerald glow. One working column: animated deadline counters, a progress bar,
   then each task as its own soft card under a deadline heading.
   Single light theme by request; navy and emerald come from the school crest. */
:root {
  color-scheme: light;
  --bg: #f5f8fb;
  --surface: #ffffff;
  --glass: rgba(255, 255, 255, 0.82);
  --fg: #0b2f52;
  --muted: #5b6e80;
  --line: #e1e8ef;
  --navy: #0a4478;
  --navy-2: #0d5a9c;
  --navy-fg: #ffffff;
  --accent: #128553;
  --accent-deep: #0e7446;
  --accent-fg: #ffffff;
  --accent-soft: #e3f6ec;
  --navy-soft: #e4eef8;
  --danger: #c62f2a;
  --danger-soft: #fdebea;
  --warn: #a35f00;
  --warn-soft: #fff2d9;
  --glow-a: rgba(20, 145, 90, 0.22);
  --glow-b: rgba(10, 68, 120, 0.20);
  --shine: rgba(255, 255, 255, 0.45);
  --shadow: 0 1px 2px rgba(11, 47, 82, 0.05), 0 8px 24px -12px rgba(11, 47, 82, 0.18);
  --shadow-lift: 0 2px 4px rgba(11, 47, 82, 0.06), 0 18px 36px -14px rgba(11, 47, 82, 0.28);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --font-display: "Plus Jakarta Sans", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-body: "Plus Jakarta Sans", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* drifting glow */
.glow { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.glow i { position: absolute; width: 520px; height: 520px; border-radius: 50%; filter: blur(70px); }
.glow i:nth-child(1) { background: var(--glow-a); top: -180px; left: -140px; animation: drift-a 22s ease-in-out infinite alternate; }
.glow i:nth-child(2) { background: var(--glow-b); top: 120px; right: -200px; animation: drift-b 26s ease-in-out infinite alternate; }
.glow i:nth-child(3) { background: var(--glow-a); bottom: -260px; left: 30%; animation: drift-a 30s ease-in-out infinite alternate-reverse; }
@keyframes drift-a { to { transform: translate(120px, 90px) scale(1.15); } }
@keyframes drift-b { to { transform: translate(-140px, 60px) scale(0.9); } }

.shell { position: relative; z-index: 1; }
.band { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4); border-bottom: 1px solid var(--line); }
.band-inner, .wrap {
  max-width: 860px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.band-inner { padding-block: 10px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.wrap { padding-block: 24px 72px; display: flex; flex-direction: column; gap: 22px; }

.crest { height: 72px; width: auto; flex: none; display: block; animation: crest-in 0.9s var(--ease) both; transition: transform 0.5s var(--ease); }
.crest:hover { transform: scale(1.06) rotate(-2deg); }
@keyframes crest-in { from { opacity: 0; transform: translateY(-14px) scale(0.85); } }
.top-text { flex: 1; min-width: 160px; animation: rise 0.7s var(--ease) 0.1s both; }
.top-text h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.25; color: var(--navy); background: linear-gradient(100deg, var(--navy) 10%, var(--accent) 90%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
html[lang="ar"] .top-text h1 { letter-spacing: 0; line-height: 1.5; }
.top-text p { margin: 0; color: var(--muted); font-size: 13px; }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; animation: rise 0.7s var(--ease) 0.2s both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }

.btn { position: relative; overflow: hidden; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 9px 18px; cursor: pointer; font-weight: 600; transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease), border-color 0.2s, background 0.2s, color 0.2s; }
.btn:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--navy); }
.btn:active { transform: scale(0.96); }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-deep)); border-color: transparent; color: var(--accent-fg); font-weight: 700; box-shadow: 0 8px 20px -8px var(--accent); }
.btn.primary::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, var(--shine) 50%, transparent 70%); transform: translateX(-120%); }
.btn.primary:hover::after { animation: shine 0.9s var(--ease); }
@keyframes shine { to { transform: translateX(120%); } }
.btn.small { padding: 4px 12px; font-size: 13px; }
.btn.danger { color: var(--danger); border-color: var(--danger); background: var(--danger-soft); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--muted); box-shadow: none; }
.btn.quiet:hover { color: var(--navy); background: var(--navy-soft); box-shadow: none; transform: none; }

/* summary */
.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.stat { background: var(--surface); border-radius: 20px; padding: 16px 18px; box-shadow: var(--shadow); min-width: 0; animation: rise 0.7s var(--ease) both; transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease); }
.stat:nth-child(2) { animation-delay: 0.08s; } .stat:nth-child(3) { animation-delay: 0.16s; }
.stat:hover { transform: translateY(-4px); box-shadow: var(--shadow-lift); }
.stat b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--navy); }
.stat span { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.stat span::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--navy); flex: none; }
.stat.is-overdue b { color: var(--danger); } .stat.is-overdue span::before { background: var(--danger); }
.stat.is-overdue.hot span::before { animation: pulse 1.6s ease-out infinite; }
.stat.is-today b { color: var(--warn); } .stat.is-today span::before { background: var(--warn); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--danger); } 100% { box-shadow: 0 0 0 10px transparent; } }

.progress { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); animation: rise 0.7s var(--ease) 0.22s both; }
.progress .track { flex: 1; height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.progress .fill { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--navy), var(--accent)); transition: width 0.9s var(--ease); }

/* form */
.panel { background: var(--surface); border-radius: 24px; padding: 22px; box-shadow: var(--shadow-lift); transform-origin: top center; }
.panel:not([hidden]) { animation: drop 0.45s var(--ease) both; }
@keyframes drop { from { opacity: 0; transform: translateY(-16px) scale(0.97); } }
.panel h2 { font-size: 20px; font-weight: 800; margin-bottom: 14px; color: var(--navy); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: 13px; font-weight: 700; }
.field label small { font-weight: 400; color: var(--muted); font-size: inherit; }
.field input, .field textarea { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--bg); width: 100%; min-width: 0; transition: border-color 0.2s, box-shadow 0.25s, background 0.2s; }
.field input:focus, .field textarea:focus, .search:focus { outline: none; border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 4px var(--accent-soft); }
.field textarea { resize: vertical; min-height: 70px; }
.form-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; align-items: center; }
.form-error { color: var(--danger); font-size: 13px; }
.form-error:not(:empty) { animation: shake 0.4s; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

/* toolbar */
.toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; animation: rise 0.7s var(--ease) 0.28s both; }
.tabs { position: relative; display: flex; padding: 4px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); }
.tabs .ind { position: absolute; top: 4px; bottom: 4px; left: 0; width: 0; border-radius: 999px; background: linear-gradient(135deg, var(--navy), var(--navy-2)); transition: transform 0.45s var(--ease), width 0.45s var(--ease); }
.tabs button { position: relative; z-index: 1; border: 0; background: transparent; padding: 7px 18px; border-radius: 999px; cursor: pointer; font-weight: 600; color: var(--muted); transition: color 0.3s; }
.tabs button[aria-pressed="true"] { color: var(--navy-fg); }
.search { flex: 1; min-width: 160px; border: 1.5px solid transparent; border-radius: 999px; padding: 9px 18px; background: var(--surface); box-shadow: var(--shadow); transition: border-color 0.2s, box-shadow 0.25s; }

.notice { border-radius: 16px; padding: 10px 16px; font-size: 14px; background: var(--warn-soft); color: var(--fg); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.notice:not([hidden]) { animation: rise 0.5s var(--ease) both; }

/* tasks */
.groups { display: flex; flex-direction: column; gap: 24px; }
.group h3 { font-size: 15px; font-weight: 800; color: var(--navy); margin-bottom: 10px; display: flex; gap: 8px; align-items: center; }
.group h3 .count { font-size: 12px; font-weight: 700; min-width: 22px; text-align: center; padding: 1px 7px; border-radius: 999px; background: var(--navy-soft); color: var(--navy); font-variant-numeric: tabular-nums; }
.group.overdue h3 { color: var(--danger); } .group.overdue h3 .count { background: var(--danger-soft); color: var(--danger); }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.task { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 14px; padding: 16px 18px; align-items: start; background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease), opacity 0.4s var(--ease); }
.task:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); }
.task.enter { animation: card-in 0.6s var(--ease) both; animation-delay: calc(var(--i, 0) * 70ms); }
@keyframes card-in { from { opacity: 0; transform: translateY(22px) scale(0.97); } }
.task.completing { opacity: 0; transform: translateX(40px) scale(0.96); }
[dir="rtl"] .task.completing { transform: translateX(-40px) scale(0.96); }
.task.removing { opacity: 0; transform: scale(0.9); }
.task .check { padding-top: 1px; }
.task .check input { appearance: none; -webkit-appearance: none; width: 24px; height: 24px; margin: 0; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; transition: background 0.3s, border-color 0.3s, transform 0.3s var(--ease), box-shadow 0.3s; }
.task .check input:hover { border-color: var(--accent); transform: scale(1.12); box-shadow: 0 0 0 5px var(--accent-soft); }
.task .check input::after { content: ""; width: 6px; height: 11px; border: solid var(--accent-fg); border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg) scale(0); transition: transform 0.35s var(--ease); }
.task .check input:checked { background: var(--accent); border-color: var(--accent); animation: pop 0.45s var(--ease); }
.task .check input:checked::after { transform: translateY(-1px) rotate(45deg) scale(1); }
@keyframes pop { 0% { box-shadow: 0 0 0 0 var(--accent); } 40% { transform: scale(1.3); } 100% { box-shadow: 0 0 0 12px transparent; } }
.task .title { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
.task .title bdi { transition: color 0.3s; }
.task.is-done .title bdi { color: var(--muted); text-decoration: line-through; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); vertical-align: 2px; margin-inline-start: 6px; }
.task.late { background: var(--danger-soft); box-shadow: inset 0 0 0 1.5px var(--danger), var(--shadow); }
.task.late:hover { box-shadow: inset 0 0 0 1.5px var(--danger), var(--shadow-lift); }
.task.late .title, .task.late .due span { color: var(--danger); }
.task.late .due.overdue strong { background: var(--danger); color: var(--navy-fg); }
.task.late .check input { border-color: var(--danger); }
.lbl { font-size: 13px; font-weight: 700; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 16px; font-weight: 700; cursor: pointer; color: var(--muted); transition: transform 0.25s var(--ease), border-color 0.2s, background 0.2s, color 0.2s; }
.chip:hover { border-color: var(--accent); transform: translateY(-2px); }
.chip[aria-pressed="true"] { background: linear-gradient(135deg, var(--accent), var(--accent-deep)); border-color: transparent; color: var(--accent-fg); animation: chip-pop 0.35s var(--ease); }
@keyframes chip-pop { 40% { transform: scale(1.12); } }
.me-row { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; background: var(--surface); border-radius: 20px; padding: 12px 16px; box-shadow: var(--shadow); animation: rise 0.7s var(--ease) 0.3s both; }
.me-row b { font-size: 14px; color: var(--navy); }
.me-row small { color: var(--muted); font-size: 13px; flex-basis: 100%; }
.me-name { display: flex; align-items: center; gap: 4px 8px; flex-wrap: wrap; flex-basis: 100%; font-size: 14px; color: var(--muted); }
.me-name bdi { font-weight: 700; color: var(--navy); }
.name-card { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; background: var(--surface); border: 2px solid var(--accent); border-radius: 20px; padding: 14px 16px; box-shadow: var(--shadow); }
.name-card b { flex-basis: 100%; font-size: 15px; color: var(--navy); }
.name-card input { flex: 1; min-width: 160px; border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--bg); }
.name-card input:focus { outline: none; border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 4px var(--accent-soft); }
.name-card small { flex-basis: 100%; color: var(--muted); font-size: 13px; }
.name-card .chips { flex-basis: 100%; }
#admin-add .form-error { flex-basis: 100%; }
#admin-add .form-error:empty { display: none; }
.admin-list { list-style: none; display: flex; flex-direction: column; }
.admin-list li { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 0; border-top: 1px solid var(--line); }
.admin-list li span { flex: 1; min-width: 0; direction: ltr; text-align: start; overflow-wrap: anywhere; font-size: 14px; }
.admin-list li small { color: var(--muted); font-size: 12px; }
.people-search { width: 100%; margin: 4px 0 8px; border: 1.5px solid var(--line); box-shadow: none; }
.people-list .t-id { flex: 1; min-width: 180px; display: flex; flex-direction: column; }
.people-list .t-id b { color: var(--navy); font-size: 15px; }
.people-list .t-id small { direction: ltr; text-align: start; overflow-wrap: anywhere; font-size: 13px; }
.people-list .t-tag { align-self: flex-start; margin-top: 4px; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
.role-switch { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; background: var(--bg); }
.role-switch button { border: 0; background: transparent; border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 13px; color: var(--muted); cursor: pointer; min-height: 36px; transition: background 0.2s, color 0.2s; }
.role-switch button[aria-pressed="true"] { background: var(--navy); color: var(--navy-fg); }
.role-switch button[data-r="manager"][aria-pressed="true"] { background: linear-gradient(135deg, var(--accent), var(--accent-deep)); color: var(--accent-fg); }
.role-fixed { font-size: 13px; font-weight: 800; padding: 6px 14px; border-radius: 999px; background: var(--navy-soft); color: var(--navy); }
@media (pointer: coarse) { .role-switch button { min-height: 44px; } }
.gate { max-width: 440px; margin: 40px auto; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.gate h2 { margin-bottom: 0; }
.gate p { color: var(--muted); font-size: 14px; }
.gate-crest { width: 72px; height: auto; }
.gate-btn { display: inline-flex; align-items: center; gap: 10px; padding: 11px 22px; font-size: 15px; }
.gate .form-error { color: var(--danger); background: var(--danger-soft); border: 1px solid var(--danger); border-radius: 12px; padding: 10px 14px; font-size: 14px; font-weight: 600; }
.gate .form-error:empty { display: none; }
body.gated .wrap > :not(#gate), body.gated #new-btn, body.gated #admin-badge { display: none !important; }
.chip:disabled { cursor: default; }
.chip:disabled:hover { transform: none; border-color: var(--line); }
.teachers summary { cursor: pointer; font-size: 18px; font-weight: 800; color: var(--navy); list-style-position: inside; }
.teachers .count { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--navy-soft); color: var(--navy); vertical-align: 3px; }
.teachers-hint { color: var(--muted); font-size: 13px; margin: 10px 0 4px; }
.teacher-list { list-style: none; display: flex; flex-direction: column; }
.teacher-list li { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; padding: 12px 0; border-top: 1px solid var(--line); }
.teacher-list .t-id { flex: 1; min-width: 180px; display: flex; flex-direction: column; }
.teacher-list .t-id b { color: var(--navy); }
.teacher-list .t-id small { color: var(--muted); direction: ltr; text-align: start; overflow-wrap: anywhere; }
.teacher-list .chip { padding: 4px 12px; font-size: 13px; }
.super-mode #teachers-panel { display: none !important; }
.teacher-list .t-tag { align-self: flex-start; margin-top: 4px; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
.roster-form { display: flex; flex-direction: column; gap: 6px; margin: 8px 0 12px; }
.roster-form label { font-size: 13px; font-weight: 700; }
.roster-form textarea { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--bg); min-height: 70px; resize: vertical; }
.roster-form textarea:focus { outline: none; border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 4px var(--accent-soft); }
.roster-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.restore-row span { color: var(--danger); font-weight: 600; }
.teachers #backup-row { margin-top: 12px; }
.super-mode #summary, .super-mode .toolbar, .super-mode #board, .super-mode #progress, .super-mode #notice, .super-mode #form-panel, .super-mode #new-btn { display: none !important; }
.name-card .form-error { flex-basis: 100%; }
.name-card .form-error:empty { display: none; }
.who { margin-top: 8px; font-size: 13px; }
.who summary { cursor: pointer; font-weight: 700; color: var(--navy); width: fit-content; }
.who h4 { font-size: 12px; font-weight: 700; color: var(--muted); margin: 8px 0 4px; }
.who-list { display: flex; flex-wrap: wrap; gap: 6px; }
.who-list span { padding: 2px 10px; border-radius: 999px; font-size: 12px; background: var(--navy-soft); color: var(--navy); }
.who-list.ok span { background: var(--accent-soft); color: var(--accent-deep); }
.who .btn { margin-top: 8px; }
a.btn { text-decoration: none; display: inline-block; }
.btn.wa { color: var(--accent-deep); border-color: var(--accent); background: var(--surface); }
.btn.wa:hover { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.tag.urgent { background: var(--danger); color: var(--navy-fg); }
.tag.rep { background: var(--accent-soft); color: var(--accent-deep); }
.group.urgent h3 { color: var(--danger); } .group.urgent h3 .count { background: var(--danger-soft); color: var(--danger); }
.field select { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--bg); width: 100%; min-width: 0; font: inherit; color: inherit; }
.chip.urgent-chip[aria-pressed="true"] { background: var(--danger); }
.tag.new { background: var(--accent); color: var(--accent-fg); animation: new-pulse 1.8s ease-out infinite; }
@keyframes new-pulse { 0% { box-shadow: 0 0 0 0 var(--accent); } 100% { box-shadow: 0 0 0 9px transparent; } }
.tag.sched { background: var(--navy-soft); color: var(--navy); }
.task .details { margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
.task .meta { margin-top: 6px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.task .actions { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.link-btn { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; background: var(--accent-soft); color: var(--accent-deep); border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 14px; max-width: 100%; transition: background 0.25s, color 0.25s, transform 0.25s var(--ease), box-shadow 0.25s; }
.link-btn:hover { background: var(--accent); color: var(--accent-fg); transform: translateY(-2px); box-shadow: 0 8px 18px -8px var(--accent); }
.link-btn .arrow { display: inline-block; transition: transform 0.3s var(--ease); }
.link-btn:hover .arrow { transform: translate(3px, -3px); }
[dir="rtl"] .link-btn:hover .arrow { transform: translate(-3px, -3px); }
.link-btn .host { font-weight: 500; opacity: 0.75; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; direction: ltr; }
.due { text-align: end; font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.due strong { font-size: 13px; font-weight: 700; padding: 3px 12px; border-radius: 999px; background: var(--navy-soft); color: var(--navy); }
.due.overdue strong { background: var(--danger-soft); color: var(--danger); }
.due.today strong { background: var(--warn-soft); color: var(--warn); }
.due.is-done strong { background: var(--accent-soft); color: var(--accent-deep); }

.empty { text-align: center; color: var(--muted); padding: 44px 16px; background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); animation: rise 0.6s var(--ease) both; }
.empty .orb { width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 50%; background: linear-gradient(135deg, var(--navy), var(--accent)); display: grid; place-items: center; animation: bob 3s ease-in-out infinite; box-shadow: 0 14px 28px -12px var(--accent); }
.empty .orb::after { content: ""; width: 12px; height: 22px; border: solid var(--accent-fg); border-width: 0 4px 4px 0; transform: translateY(-3px) rotate(45deg); }
@keyframes bob { 50% { transform: translateY(-8px); } }
.empty b { display: block; color: var(--navy); font-family: var(--font-display); font-weight: 800; font-size: 18px; margin-bottom: 4px; }
.skeleton { height: 92px; border-radius: 20px; background: linear-gradient(100deg, var(--surface) 30%, var(--navy-soft) 50%, var(--surface) 70%) 0 0 / 300% 100%; animation: shimmer 1.4s linear infinite; box-shadow: var(--shadow); }
@keyframes shimmer { to { background-position: -150% 0; } }
.loading-note { text-align: center; color: var(--muted); font-size: 14px; margin: 14px 0 0; }

#toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--navy); color: var(--navy-fg); padding: 11px 20px; border-radius: 999px; font-size: 14px; max-width: calc(100% - 32px); z-index: 40; box-shadow: var(--shadow-lift); }
#toast:not([hidden]) { animation: toast-in 0.45s var(--ease) both; }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 24px) scale(0.9); } }

.profile { position: relative; }
.profile-btn { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; min-height: 44px; max-width: 240px; }
[dir="rtl"] .profile-btn { padding: 4px 4px 4px 12px; }
.profile-btn .pname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.profile-btn .caret { flex: none; color: var(--muted); transition: transform 0.2s var(--ease); }
.profile-btn[aria-expanded="true"] .caret { transform: rotate(180deg); }
.avatar { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; overflow: hidden; background: linear-gradient(135deg, var(--navy), var(--accent)); color: var(--navy-fg); font-size: 13px; font-weight: 800; letter-spacing: 0.02em; }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avatar.big { width: 52px; height: 52px; font-size: 18px; }
.profile-menu[hidden] { display: none; }
body.gated #profile { display: none !important; }
.profile-menu { position: absolute; top: calc(100% + 8px); inset-inline-end: 0; z-index: 40; width: min(300px, calc(100vw - 32px)); background: var(--surface); border-radius: 18px; box-shadow: var(--shadow-lift); padding: 16px; display: flex; flex-direction: column; gap: 12px; animation: drop 0.25s var(--ease) both; }
.pm-head { display: flex; align-items: center; gap: 12px; }
.pm-id { display: flex; flex-direction: column; min-width: 0; }
.pm-id b { font-size: 16px; color: var(--navy); overflow-wrap: anywhere; }
.pm-email { font-size: 13px; color: var(--muted); direction: ltr; text-align: start; overflow-wrap: anywhere; }
.pm-role { align-self: flex-start; margin-top: 4px; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--navy-soft); color: var(--navy); }
.pm-row { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); }
.pm-row b { color: var(--fg); }
.pm-out { align-self: stretch; min-height: 40px; }
@media (max-width: 560px) {
  .profile-btn .pname, .profile-btn .caret { display: none; }
  .profile-btn, [dir="rtl"] .profile-btn { padding: 4px; }
}
.badge { align-self: center; font-size: 12px; font-weight: 800; padding: 4px 12px; border-radius: 999px; background: var(--navy); color: var(--navy-fg); }
.links p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
.link-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 0; border-top: 1px solid var(--line); }
.link-row b { font-size: 13px; min-width: 90px; }
.link-row input { flex: 1; min-width: 140px; border: 1.5px solid var(--line); border-radius: 10px; padding: 7px 10px; background: var(--bg); }
.link-row span { flex: 1; min-width: 0; font-size: 14px; color: var(--muted); }
.link-row code { flex: 1; min-width: 0; direction: ltr; text-align: left; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; background: var(--bg); border-radius: 8px; padding: 6px 10px; overflow-wrap: anywhere; user-select: all; }

@media (max-width: 560px) {
  .crest { height: 56px; }
  .top-text h1 { font-size: 22px; }
  .form-grid { grid-template-columns: 1fr; }
  .summary { gap: 8px; }
  .stat { padding: 12px; border-radius: 16px; } .stat b { font-size: 28px; }
  .task { grid-template-columns: auto minmax(0, 1fr); }
  .due { grid-column: 2; grid-row: 1; flex-direction: row; align-items: center; justify-content: flex-start; white-space: normal; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  .task .body { grid-column: 2; }
  .tabs button { padding: 7px 14px; }
}
/* touch screens: every control at least 44px tall, and no tap delay */
button, a, input, summary, select { touch-action: manipulation; }
@media (pointer: coarse) {
  .btn.small, .chip, .tabs button, .link-btn { min-height: 44px; }
  a.btn, .link-btn { display: inline-flex; align-items: center; }
  .btn.small { padding-inline: 16px; }
  .task .actions { gap: 8px; }
  .who summary { padding: 12px 0; }
  .task .check { padding: 10px; margin: -10px; cursor: pointer; }
  .task .check input { width: 28px; height: 28px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div class="wrap">
  <section class="panel gate" id="gate" hidden>
    <img class="gate-crest" id="gate-crest" alt="">
    <h2 data-i18n="gateTitle">Sign in</h2>
    <p id="gate-msg"></p>
    <button class="btn gate-btn" type="button" id="google-btn" hidden>
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      <span data-i18n="gSignIn">Sign in with Google</span>
    </button>
    <p class="form-error" id="gate-err" role="alert"></p>
  </section>

  <section class="panel" id="form-panel" hidden>
    <h2 id="form-title">New task</h2>
    <form id="task-form" novalidate>
      <div class="form-grid">
        <div class="field full">
          <label for="f-title" data-i18n="fTask">Task</label>
          <input id="f-title" type="text" maxlength="200" dir="auto" data-i18n-ph="fTaskPh" required>
        </div>
        <div class="field full">
          <label for="f-links"><span data-i18n="fLink">Link</span> <small data-i18n="fLinkHint">(Google Doc, form, folder…)</small></label>
          <textarea id="f-links" rows="2" maxlength="4000" dir="ltr" placeholder="https://…"></textarea>
        </div>
        <div class="field">
          <label for="f-due" data-i18n="fDue">Deadline date</label>
          <input id="f-due" type="date" required>
        </div>
        <div class="field">
          <label for="f-time"><span data-i18n="fTime">Time</span> <small data-i18n="optional">(optional)</small></label>
          <input id="f-time" type="time">
        </div>
        <div class="field">
          <label for="f-post"><span data-i18n="fPost">Post date</span> <small data-i18n="fPostHint">(optional)</small></label>
          <input id="f-post" type="date">
        </div>
        <div class="field">
          <label for="f-post-time"><span data-i18n="fPostTime">Post time</span> <small data-i18n="optional">(optional)</small></label>
          <input id="f-post-time" type="time">
        </div>
        <div class="field">
          <label for="f-repeat" data-i18n="fRepeat">Repeat</label>
          <select id="f-repeat">
            <option value="" data-i18n="repNone">Does not repeat</option>
            <option value="daily" data-i18n="rep_daily">Every day</option>
            <option value="weekly" data-i18n="rep_weekly">Every week</option>
            <option value="monthly" data-i18n="rep_monthly">Every month</option>
          </select>
        </div>
        <div class="field">
          <span class="lbl" id="pri-lbl" data-i18n="fPriority">Priority</span>
          <div class="chips" role="group" aria-labelledby="pri-lbl">
            <button type="button" class="chip urgent-chip" id="f-urgent" aria-pressed="false" data-i18n="urgent">Urgent</button>
          </div>
        </div>
        <div class="field full">
          <span class="lbl" id="aud-lbl" data-i18n="fAud">Who is it for?</span>
          <div class="chips" id="f-groups" role="group" aria-labelledby="aud-lbl">
            <button type="button" class="chip" data-g="all" aria-pressed="true" data-i18n="allStaff">All staff</button>
            <button type="button" class="chip" data-g="KS1" aria-pressed="false">KS1</button>
            <button type="button" class="chip" data-g="KS2" aria-pressed="false">KS2</button>
            <button type="button" class="chip" data-g="KS3" aria-pressed="false">KS3</button>
            <button type="button" class="chip" data-g="KS4" aria-pressed="false">KS4</button>
          </div>
        </div>
        <div class="field full">
          <label for="f-details"><span data-i18n="fDetails">Details</span> <small data-i18n="optional">(optional)</small></label>
          <textarea id="f-details" maxlength="2000" dir="auto" data-i18n-ph="fDetailsPh"></textarea>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn primary" type="submit" id="f-submit">Post task</button>
        <button class="btn" type="button" id="f-cancel" data-i18n="cancel">Cancel</button>
        <span class="form-error" id="f-error" role="alert"></span>
      </div>
    </form>
  </section>

  <section class="panel links" id="admin-panel" hidden>
    <h2 data-i18n="linksTitle">Links to share</h2>
    <p data-i18n="adminIntro"></p>
    <div class="link-row"><b data-i18n="linkStaff">Staff link</b><code id="url-staff"></code><button class="btn small" type="button" data-copy="url-staff" data-i18n="copy">Copy</button></div>
    <div class="link-row"><b data-i18n="linkAdmin">Admin link</b><code id="url-admin"></code><button class="btn small" type="button" data-copy="url-admin" data-i18n="copy">Copy</button></div>
    <div class="link-row" id="super-link-row" hidden><b data-i18n="linkSuper">Super admin link</b><code id="url-super"></code><button class="btn small" type="button" data-copy="url-super" data-i18n="copy">Copy</button></div>
    <div class="link-row" id="signout-row" hidden>
      <span id="signed-text"></span>

    shown.forEach(function (r) {

      var id = h("div", { class: "t-id" }, h("b", null, h("bdi", { text: r.name })), h("small", { text: r.email }));
      if (!r.signedIn) id.appendChild(h("span", { class: "t-tag", text: t("notSigned") }));
      ul.appendChild(h("li", null, id, sw));
    });
  }
  $("#people-search").addEventListener("input", function (e) { S.peopleQ = e.target.value; render(); });
  function saveAdmins(list) {
    if (!fb || roleOf() !== "super") { toast(t("superOnly")); return; }
    toast(t("saving"));
    fb.db.doc("config/admins").set({ emails: cleanEmails(list).slice(0, 50), updatedAt: new Date().toISOString() })
      .then(function () { toast(t("saved")); }, function () { toast(t("errSave")); });
  }
  $("#admin-add").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var inp = $("#f-admin-email"), err = $("#admin-error"), e = inp.value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) { err.textContent = t("vEmail"); inp.focus(); return; }
    if (e === SUPER || ADMINS.indexOf(e) !== -1) { err.textContent = t("dupEmail"); inp.focus(); return; }
    err.textContent = ""; inp.value = "";
    saveAdmins(ADMINS.concat([e]));
  });
  /* a non-school email may still be let in if it is on the staff list; listening means that
     taking someone off the list signs them out straight away */
  var listedUnsub = null;
  function watchListed(email) {
    if (listedUnsub) { listedUnsub(); listedUnsub = null; }
    S.listed = false; S.listedLoaded = !email;
    if (!email || !fb) return;
    listedUnsub = fb.db.collection("roster").doc(email).onSnapshot(function (snap) {
      if (S.user !== email) return;
      S.listed = snap.exists; S.listedLoaded = true; applyRole();
    }, function () { if (S.user !== email) return; S.listed = false; S.listedLoaded = true; applyRole(); });
  }
  function watchAdmins(on) {
    if (adminsUnsub) { adminsUnsub(); adminsUnsub = null; }
    ADMINS = []; S.adminsLoaded = false;
    if (!on || !fb) return;
    adminsUnsub = fb.db.doc("config/admins").onSnapshot(function (snap) {
      ADMINS = cleanEmails(snap.exists ? (snap.data() || {}).emails : []);
      S.adminsLoaded = true; applyRole();
    }, function () { ADMINS = []; S.adminsLoaded = true; applyRole(); });
  }
  function applyRole() {
    var role = roleOf();
    /* a school account gets in straight away; any other account only if it is a manager
       or the managers put that email on the staff list */
    S.authReady = !S.user || domainOK(S.user) || !!role || (!!S.adminsLoaded && !!S.listedLoaded);
    S.allowed = !!S.user && (domainOK(S.user) || !!role || !!S.listed);
    if (S.user && !S.allowed && S.authReady) {
      S.gateErr = t("wrongAcct", { e: S.user, d: "@" + SCHOOL });
      signOutAll();
    }
    if (S.allowed) S.gateErr = "";
    watchTasks(S.allowed);
    if (S.allowed) loadMine();
    var ro = !role;
    if (ro !== S.readOnly || !!peopleUnsub !== (S.admin && !ro)) { S.readOnly = ro; watchPeople(S.admin && !ro); }
    render();
  }
  $("#google-btn").addEventListener("click", function () {
    if (!fb) return;
    S.gateErr = ""; render();
    var p = new firebase.auth.GoogleAuthProvider();
    p.setCustomParameters({ prompt: "select_account" });
    fb.auth.signInWithPopup(p).catch(function (e) {
      var c = e && e.code;
      if (c === "auth/popup-blocked" || c === "auth/operation-not-supported-in-this-environment") { fb.auth.signInWithRedirect(p); return; }
      if (c !== "auth/popup-closed-by-user" && c !== "auth/cancelled-popup-request") toast(t("signFail"));
    });
  });

  /* ---- profile button in the header: Google photo or initials, name, and a small menu ---- */
  function initials(n) {
    var parts = String(n || "").trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return "?";
    var a = parts[0].charAt(0), b = parts.length > 1 ? parts[parts.length - 1].charAt(0) : "";
    return (a + b).toUpperCase();
  }
  function fillAvatar(el) {
    var key = ME.photo + "|" + ME.name;
    if (el.dataset.key === key) return;
    el.dataset.key = key; el.textContent = "";
    if (ME.photo) {
      var img = h("img", { src: ME.photo, alt: "", referrerpolicy: "no-referrer" });
      img.addEventListener("error", function () { el.textContent = initials(ME.name); });
      el.appendChild(img);
    } else el.textContent = initials(ME.name);
  }
  function renderProfile() {
    var show = !!S.allowed && !!ME.uid;
    $("#profile").hidden = !show;
    if (!show) { closeProfile(); return; }
    var role = roleOf();
    $("#profile-name").textContent = ME.name;
    fillAvatar($("#avatar")); fillAvatar($("#avatar-big"));
    $("#pm-name").textContent = ME.name;
    $("#pm-email").textContent = ME.email;
    $("#pm-role").textContent = t(role === "super" ? "roleSuper" : role === "admin" ? "roleAdmin" : "roleTeacher");
    $("#pm-ks").textContent = MINE.length ? MINE.join(S.lang === "ar" ? "، " : ", ") : t("pmNoKS");
    $("#profile-btn").setAttribute("aria-label", t("profileLbl") + ": " + ME.name);
  }
  function closeProfile() {
    var m = $("#profile-menu");
    if (m.hidden) return;
    m.hidden = true; $("#profile-btn").setAttribute("aria-expanded", "false");
  }
  $("#profile-btn").addEventListener("click", function (e) {
    e.stopPropagation();
    var m = $("#profile-menu"), open = m.hidden;
    if (open) {
      /* on phones, stretch the menu across the screen with a 16px margin each side */
      var narrow = innerWidth <= 560, pr = $("#profile").getBoundingClientRect();
      m.style.width = narrow ? (innerWidth - 32) + "px" : "";
      m.style.left = narrow ? Math.round(16 - pr.left) + "px" : "";
      m.style.insetInlineEnd = narrow ? "auto" : "";
    }
    m.hidden = !open; this.setAttribute("aria-expanded", String(open));
  });
  document.addEventListener("click", function (e) { if (!$("#profile").contains(e.target)) closeProfile(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !$("#profile-menu").hidden) { closeProfile(); $("#profile-btn").focus(); }
  });
  $("#pm-signout").addEventListener("click", function () { closeProfile(); signOutAll(); });

  /* ---- actions ---- */
  function toggleDone(taskId, checked, li) {
    function commit() {
      if (checked) DONE[taskId] = new Date().toISOString(); else delete DONE[taskId];
      saveDone(); render(); syncMe();
    }
    if (calm || !li || S.tab === "all") { commit(); return; }
    if (checked) li.classList.add("is-done");
    setTimeout(function () { li.classList.add("completing"); }, 350);
    setTimeout(commit, 750);
  }
  function removeExamples() {
    saveTasks(function (list) { return list.filter(function (k) { return !k.example; }); });
  }
  function openForm(k, copy) {
    S.editing = k && !copy ? k.id : null;
    $("#form-title").textContent = t(S.editing ? "formEdit" : "formNew");
    $("#f-submit").textContent = t(S.editing ? "save" : "post");
    $("#f-title").value = k ? (k.title || "") : "";
    $("#f-links").value = k ? linksOf(k).join("\n") : "";
    $("#f-repeat").value = k && isRepeat(k) ? k.repeat : "";
    $("#f-urgent").setAttribute("aria-pressed", String(!!(k && k.urgent)));
    $("#f-due").value = k ? (k.due || "") : "";
    $("#f-time").value = k ? (k.time || "") : "";
    $("#f-post").value = k ? (k.postOn || "") : "";
    $("#f-post-time").value = k ? (k.postTime || "") : "";
    setFormGroups(k ? groupsOf(k) : []);
    $("#f-details").value = k ? (k.details || "") : "";
    $("#f-error").textContent = "";
    $("#form-panel").hidden = false;
    window.scrollTo({ top: 0, behavior: calm ? "auto" : "smooth" });
    $("#f-title").focus({ preventScroll: true });
  }
  function closeForm() { $("#form-panel").hidden = true; S.editing = null; }
  function formError(msg, el) { var err = $("#f-error"); err.textContent = ""; void err.offsetWidth; err.textContent = msg; el.focus(); }

  function formGroups() {
    var g = [];
    document.querySelectorAll("#f-groups .chip").forEach(function (c) { if (c.dataset.g !== "all" && c.getAttribute("aria-pressed") === "true") g.push(c.dataset.g); });
    return g;
  }
  function setFormGroups(g) {
    document.querySelectorAll("#f-groups .chip").forEach(function (c) {
      c.setAttribute("aria-pressed", String(c.dataset.g === "all" ? !g.length : g.indexOf(c.dataset.g) !== -1));
    });
  }
  document.querySelectorAll("#f-groups .chip").forEach(function (c) {
    c.addEventListener("click", function () {
      if (c.dataset.g === "all") { setFormGroups([]); return; }
      var g = formGroups(), i = g.indexOf(c.dataset.g);
      if (i === -1) g.push(c.dataset.g); else g.splice(i, 1);
      setFormGroups(g);
    });
  });
  document.querySelectorAll("#my-groups .chip").forEach(function (c) {
    c.addEventListener("click", function () {
      if (LOCKED.length) return;
      var i = MINE.indexOf(c.dataset.m);
      if (i === -1) MINE.push(c.dataset.m); else MINE.splice(i, 1);
      MINE = KS.filter(function (x) { return MINE.indexOf(x) !== -1; });
      try { localStorage.setItem("my-groups", JSON.stringify(MINE)); storeOK = true; } catch (e) { storeOK = false; }
      S.animateAll = true; render(); syncMe();
    });
  });
  document.querySelectorAll("#name-groups .chip").forEach(function (c) {
    c.addEventListener("click", function () {
      var i = NAME_KS.indexOf(c.dataset.n);
      if (i === -1) NAME_KS.push(c.dataset.n); else NAME_KS.splice(i, 1);
      NAME_KS = KS.filter(function (x) { return NAME_KS.indexOf(x) !== -1; });
      $("#name-error").textContent = "";
      render();
    });
  });
  $("#name-card").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var err = $("#name-error");
    if (!NAME_KS.length) { err.textContent = t("nameNoKS"); $("#name-groups .chip").focus(); return; }
    err.textContent = "";
    MINE = NAME_KS.slice(); LOCKED = MINE.slice();
    try { localStorage.setItem("my-groups", JSON.stringify(MINE)); } catch (e) {}
    S.animateAll = true; render(); syncMe(); toast(t("saved"));
  });
  function signOutAll() {
    if (!fb) return;
    /* forget this person's ticks and key stages on this device; they come back from the database at the next sign-in */
    DONE = {}; MINE = []; LOCKED = []; loadedMineFor = "";
    if (mineUnsub) { mineUnsub(); mineUnsub = null; }
    try { localStorage.removeItem("tasks-cache"); localStorage.removeItem("my-groups"); } catch (e) {}
    saveDone();
    fb.auth.signOut();
  }
  $("#staff-signout").addEventListener("click", signOutAll);
  $("#f-urgent").addEventListener("click", function () { this.setAttribute("aria-pressed", String(this.getAttribute("aria-pressed") !== "true")); });
  $("#new-btn").addEventListener("click", function () { openForm(null); });
  $("#f-cancel").addEventListener("click", closeForm);
  $("#task-form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var title = $("#f-title").value.trim(), due = $("#f-due").value, links = [], badLink = false;
    if (!title) { formError(t("vTitle"), $("#f-title")); return; }
    if (!/^\d{4}-\d\d-\d\d$/.test(due)) { formError(t("vDue"), $("#f-due")); return; }
    $("#f-links").value.split("\n").forEach(function (l) {
      l = l.trim(); if (!l) return;
      if (!/^https?:\/\//i.test(l)) l = "https://" + l;
      var u = /\s/.test(l) ? null : safeUrl(l);
      if (u) links.push(u); else badLink = true;
    });
    if (badLink) { formError(t("vLink"), $("#f-links")); return; }
    var postOn = $("#f-post").value;
    var postTime = $("#f-post-time").value || "";
    if (!/^\d{4}-\d\d-\d\d$/.test(postOn)) postOn = "";
    if (!postOn && postTime) { var now = new Date(); postOn = now.getFullYear() + "-" + ("0" + (now.getMonth() + 1)).slice(-2) + "-" + ("0" + now.getDate()).slice(-2); }
    if (!postOn) postTime = "";
    if (postOn && postMoment({ postOn: postOn, postTime: postTime }) > dueMoment({ due: due, time: $("#f-time").value || "" })) { formError(t("vPost"), $("#f-post")); return; }
    var data = { postOn: postOn, postTime: postTime, title: title, link: "", links: links.slice(0, 8), repeat: $("#f-repeat").value, urgent: $("#f-urgent").getAttribute("aria-pressed") === "true", due: due, time: $("#f-time").value || "", groups: formGroups(), audience: "", details: $("#f-details").value.trim() };
    var editing = S.editing;
    closeForm();
    if (!editing) data.id = "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    saveTasks(function (list) {
      if (editing) return list.map(function (k) { return k.id === editing ? Object.assign({}, k, data) : k; });
      return list.concat([data]);
    });
  });
  document.querySelectorAll(".tabs button").forEach(function (b) {
    b.addEventListener("click", function () {
      if (S.tab === b.dataset.tab) return;
      S.tab = b.dataset.tab;
      document.querySelectorAll(".tabs button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
      moveIndicator(); S.animateAll = true; render();
    });
  });
  $("#search").addEventListener("input", function (e) { S.q = e.target.value; render(); });
  window.addEventListener("resize", moveIndicator);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveIndicator);

  /* ---- boot ---- */
  applyLang(); render();

  $("#url-staff").textContent = BOARD_URL;
  $("#url-admin").textContent = BOARD_URL + "#admin";
  $("#url-super").textContent = BOARD_URL + "#super";
  $("#gate-crest").src = $(".crest").src;
  document.querySelectorAll("[data-copy]").forEach(function (b) {
    b.addEventListener("click", function () {
      var code = document.getElementById(b.getAttribute("data-copy"));
      function selectIt() { var r = document.createRange(); r.selectNodeContents(code); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }
      try { navigator.clipboard.writeText(code.textContent).then(function () { b.textContent = t("copied"); }, selectIt); } catch (e) { selectIt(); }
    });
  });
  window.addEventListener("hashchange", function () {
    try { sessionStorage.removeItem("admin"); } catch (e) {}
    readMode(); S.animateAll = true;
    watchPeople(S.admin && !S.readOnly);
    render(); moveIndicator();
  });
  function startData() {
    var cfg = window.BOARD_CONFIG;
    if (!cfg || !cfg.firebase || !cfg.firebase.projectId || cfg.firebase.projectId.indexOf("PASTE") !== -1 || !window.firebase) { S.dead = "deadSetup"; render(); return; }
    try {
      firebase.initializeApp(cfg.firebase);
      var db = firebase.firestore();
      fb = { auth: firebase.auth(), db: db, doc: db.doc("board/tasks"), email: cfg.adminEmail || "" };
    } catch (e) { S.dead = "deadSetup"; render(); return; }
    /* never remember a sign-in after the tab is closed: everyone signs in again next time */
    try { fb.auth.setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(function () {}); } catch (e) {}
    fb.auth.onAuthStateChanged(function (u) {
      S.user = u && u.email ? u.email.toLowerCase() : "";
      ME.uid = u ? u.uid : ""; ME.email = S.user; ME.name = u ? niceName(u.displayName).slice(0, 80) : "";
      if (!ME.name) ME.name = S.user;
      ME.photo = u && /^https:\/\//.test(u.photoURL || "") ? u.photoURL : "";
      if (u) S.authReady = false;
      watchAdmins(!!u);
      watchListed(S.user && !domainOK(S.user) ? S.user : "");
      applyRole();
    });
  }
  /* tasks are only readable once signed in with a school (or admin) account */
  var tasksUnsub = null, tasksTimer = 0;
  function watchTasks(on) {
    if (!!tasksUnsub === on) return;
    if (tasksUnsub) { tasksUnsub(); tasksUnsub = null; }
    clearTimeout(tasksTimer);
    if (!on || !fb) return;
    tasksTimer = setTimeout(function () { if (!S.loaded) { S.dead = "deadLoad"; render(); } }, 12000);
    tasksUnsub = fb.doc.onSnapshot(function (snap) {
      clearTimeout(tasksTimer); S.dead = "";
      var d = snap.exists ? snap.data() : null;
      S.tasks = cleanTasks(d && d.tasks); S.loaded = true;
      try { localStorage.setItem("tasks-cache", JSON.stringify(S.tasks)); } catch (e) {}
      render();
    }, function () { clearTimeout(tasksTimer); S.dead = "deadLoad"; render(); });
  }
  /* once per account: bring back this person's key stages and ticks from other devices */
  function loadMine() {
    if (!fb || !ME.uid || loadedMineFor === ME.uid) return;
    var uid = ME.uid, first = true;
    if (mineUnsub) { mineUnsub(); mineUnsub = null; }
    /* listen, so a manager's change to this teacher's key stages shows up straight away */
    mineUnsub = fb.db.collection("staff").doc(uid).onSnapshot(function (snap) {
      if (ME.uid !== uid) return;
      var x = snap.exists ? (snap.data() || {}) : {};
      if (first) {
        Object.keys(x.done || {}).forEach(function (k) { if (!DONE[k]) DONE[k] = String(x.done[k]); });
        saveDone();
      }
      LOCKED = onlyKS(x.groups);
      if (LOCKED.length || !first) {
        MINE = LOCKED.slice();
        try { localStorage.setItem("my-groups", JSON.stringify(MINE)); } catch (e) {}
      }
      var wasFirst = first; first = false;
      function ready() { if (ME.uid !== uid) return; loadedMineFor = uid; S.animateAll = wasFirst; render(); if (wasFirst) syncMe(); }
      if (wasFirst && !LOCKED.length && ME.email) {
        /* not chosen yet: if the admins put this person on the staff list with key stages, use those */
        fb.db.collection("roster").doc(ME.email).get().then(function (r) {
          var g = r.exists ? onlyKS((r.data() || {}).groups) : [];
          if (g.length && ME.uid === uid) {
            LOCKED = g; MINE = g.slice();
            try { localStorage.setItem("my-groups", JSON.stringify(MINE)); } catch (e) {}
          }
        }, function () {}).then(ready);
      } else ready();
    }, function () { if (ME.uid === uid) { loadedMineFor = uid; render(); } });
  }
  $("#signout-btn").addEventListener("click", signOutAll);
  startData();
  setInterval(function () { if (S.loaded) { applyLang(); render(); } }, 300000);
  /* show a scheduled task the moment its post time arrives */
  var lastLive = liveCount();
  setInterval(function () { var n = liveCount(); if (n !== lastLive) { lastLive = n; render(); } }, 15000);
})();
</script>
